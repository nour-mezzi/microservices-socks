clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

scrape_configs:
  # Scrape Docker container logs via service discovery
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
      # Extract container ID (short form)
      - source_labels: ['__meta_docker_container_id']
        regex: '(.{12}).*'
        replacement: '${1}'
        target_label: 'container_id'
      # Extract compose service name as 'service' label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Keep the image name as well
      - source_labels: ['__meta_docker_container_image_name']
        target_label: 'image'
      # Add the job label
      - replacement: 'docker'
        target_label: 'job'

  # Scrape system logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
